<!DOCTYPE html>
<html lang="en" data-layout="mobile">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Decision Roulette: spin a neon wheel to make a random decision. Add weighted options, save presets and keep a history. Saved in this browser only.">
  <meta name="theme-color" content="#0b0b16">
  <title>Decision Roulette | Idea By Azmat Ali</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="Decision Roulette | Idea By Azmat Ali">
  <meta property="og:description" content="Spin a neon wheel to decide. Weighted options, presets and history.">
  <meta property="og:image" content="https://decision-roulette-azmataliakbar.netlify.app/rtl1.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://decision-roulette-azmataliakbar.netlify.app/rtl1.png">
  <link rel="icon" type="image/png" href="rtl1.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">&#10148;</span>
      <div>
        <h1>Decision Roulette</h1>
        <p class="tag">Spin to decide</p>
      </div>
    </div>
    <button type="button" class="btn ghost small" id="sound-btn" aria-pressed="true">Sound on</button>
  </header>

  <p class="status" id="global-msg" role="status" aria-live="polite"></p>

  <main class="layout">

    <!-- Wheel console -->
    <section class="console" data-section="wheel" aria-labelledby="h-wheel">
      <h2 class="sr" id="h-wheel">Wheel</h2>
      <div class="wheel-wrap">
        <svg id="wheel-svg" class="wheel" viewBox="-20 -30 440 440" role="img" aria-label="Spinning decision wheel"></svg>
      </div>
      <button type="button" class="btn spin big" id="spin-btn">Spin</button>
      <p class="hint" id="spin-hint"></p>
    </section>

    <!-- Entry matrix -->
    <section class="panel" data-section="matrix" aria-labelledby="h-matrix">
      <div class="panel-head">
        <h2 class="panel-title" id="h-matrix">Entries</h2>
        <span class="muted" id="entry-count"></span>
      </div>

      <form id="add-form" class="glass card form-grid" novalidate>
        <label class="field">
          <span>New option</span>
          <input id="add-label" type="text" maxlength="30" placeholder="e.g. Pizza" autocomplete="off">
        </label>
        <div class="row-2">
          <label class="field">
            <span>Weight (1-10)</span>
            <select id="add-weight"></select>
          </label>
          <label class="field">
            <span>Colour</span>
            <input id="add-color" type="color" value="#ff3d8b">
          </label>
        </div>
        <button type="submit" class="btn neon">Add option</button>
        <p class="error" id="add-msg" role="status"></p>
      </form>

      <ul class="entries" id="entries"></ul>

      <article class="glass card">
        <h3>Presets</h3>
        <div class="row-2">
          <label class="field">
            <span>Save current list as</span>
            <input id="preset-name" type="text" maxlength="30" placeholder="e.g. Lunch">
          </label>
          <button type="button" class="btn neon" id="preset-save">Save</button>
        </div>
        <div class="row-2">
          <label class="field">
            <span>Saved presets</span>
            <select id="preset-select"></select>
          </label>
          <div class="btn-col">
            <button type="button" class="btn ghost small" id="preset-load">Load</button>
            <button type="button" class="btn ghost small danger" id="preset-delete">Delete</button>
          </div>
        </div>
        <p class="error" id="preset-msg" role="status"></p>
      </article>
    </section>

    <!-- History -->
    <section class="panel" data-section="history" aria-labelledby="h-history">
      <div class="panel-head">
        <h2 class="panel-title" id="h-history">History logs</h2>
        <button type="button" class="btn ghost small" id="clear-logs">Clear</button>
      </div>
      <ul class="logs" id="logs"></ul>
    </section>
  </main>

  <nav class="tabbar" aria-label="Sections" role="tablist">
    <button type="button" role="tab" data-target="wheel" aria-selected="true">Wheel</button>
    <button type="button" role="tab" data-target="matrix" aria-selected="false">Matrix Entries</button>
    <button type="button" role="tab" data-target="history" aria-selected="false">History Logs</button>
  </nav>

  <dialog class="result glass" id="result" aria-labelledby="result-title">
    <div class="result-body">
      <p class="result-kicker">The wheel says</p>
      <h2 id="result-title"></h2>
      <span class="result-swatch" id="result-swatch" aria-hidden="true"></span>
    </div>
    <div class="dialog-actions">
      <button type="button" class="btn ghost" id="result-close">Close</button>
      <button type="button" class="btn neon" id="result-again">Spin again</button>
    </div>
  </dialog>

  <footer class="footer">
    <span class="watermark"><span class="idea-by">Idea By: </span>Azmat Ali</span>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/wheel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
